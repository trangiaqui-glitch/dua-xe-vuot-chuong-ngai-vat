<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lạc đường rồi — Bé Đua Xe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           font-family: "Baloo 2", "Trebuchet MS", Arial, sans-serif; color: #23406b;
           background: linear-gradient(#8fd3ff, #d8f2ff 60%, #b6f0a0); }
    .card { background: #fff; border-radius: 26px; padding: 28px 32px; margin: 16px; box-shadow: 0 8px 0 rgba(35, 64, 107, .3); }
    .emoji { font-size: 72px; }
    h1 { margin: 4px 0; font-size: 34px; }
    p { margin: 4px 0 18px; font-size: 19px; }
    a { display: inline-block; background: #3ccf5a; color: #fff; text-decoration: none; font-weight: 800; font-size: 24px;
        padding: 12px 28px; border-radius: 16px; box-shadow: 0 5px 0 #229a3c; }
    a:focus-visible { outline: 4px solid #1b2a49; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">🏎️💨</div>
    <h1>Ôi, lạc đường rồi!</h1>
    <p>Trang này không có trên đường đua.</p>
    <a href="/">▶ VỀ TRANG CHỦ</a>
  </main>
</body>
</html>

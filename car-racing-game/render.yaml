# Render Blueprint — triển khai game như một Static Site (không cần server, không cần build).
# Tài liệu: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: be-dua-xe
    buildCommand: echo "Khong can build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # HTML, service worker và manifest luôn kiểm tra bản mới
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*.js
        name: Cache-Control
        value: public, max-age=300
      - path: /*.css
        name: Cache-Control
        value: public, max-age=300
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
